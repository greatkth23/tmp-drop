name: Validate iPhone shortcut source
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build-shortcut.py
      - .github/workflows/shortcut.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build unsigned credential-free template
        run: python scripts/build-shortcut.py
      - name: Validate native plist and keep signing status explicit
        run: |
          plutil -lint .wrangler/shortcuts/Temporary-Drop-unsigned.shortcut
          echo 'Unsigned authoring source only. Apple signing requires an iCloud-authenticated Mac; iPhone testing remains pending.'
      - uses: actions/upload-artifact@v4
        with:
          name: temporary-drop-shortcut-source-unsigned
          path: .wrangler/shortcuts/
          if-no-files-found: error
          retention-days: 14

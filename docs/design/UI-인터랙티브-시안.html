;justify-content:space-between;gap:14px;color:var(--muted);font-size:10px}.footer-brand{font-weight:700;letter-spacing:.1em}dialog{border:1px solid var(--line);border-radius:17px;padding:28px;width:calc(100% - 32px);max-width:470px;color:var(--ink);box-shadow:0 30px 80px #142b3326}dialog::backdrop{background:#102d3659;backdrop-filter:blur(3px)}dialog h2{font-size:21px;margin:0 0 12px;letter-spacing:-.5px}dialog p{font-size:13px;color:var(--muted);margin:0 0 16px}.dialog-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:23px;flex-wrap:wrap}.token{font-family:monospace;font-size:12px;background:#f1f4ee;border:1px solid var(--line);border-radius:8px;padding:13px;overflow-wrap:anywhere}.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);max-width:calc(100% - 32px);width:max-content;padding:12px 20px;border-radius:10px;background:var(--ink);color:white;font-size:13px;box-shadow:0 8px 30px #102d3624;z-index:10}.hidden,[hidden]{display:none!important}.mono{font-variant-numeric:tabular-nums}.preview-caption{font-size:10px;color:var(--muted);margin:17px 0 0;text-align:right}.mobile-inline{display:none}.inline-select{font-size:11px;padding:4px;border:1px solid var(--line);border-radius:5px;background:white;color:var(--muted)}

<body>
<div class="demo-bar"><div><strong>DESIGN PREVIEW · 01</strong><span class="demo-detail">　Personal Temporary Drop / 2026.10</span></div><span>검토용 시안 · 실제 인증·전송 없음</span></div>
<div class="shell">
 <header class="topbar">
  <a class="brand" href="#upload" aria-label="Temporary Drop 업로드 시안"><span class="mark" aria-hidden="true">↓</span><span><span class="brand-name">Temporary Drop</span><span class="brand-sub">PERSONAL FILE TRANSFER</span></span></a>
  <nav class="nav" aria-label="주 메뉴"><button data-page="download">파일 받기</button><button data-page="upload">파일 올리기</button><button data-page="devices">내 기기</button></nav>
  <div class="header-note"><span class="dot"></span>필요한 동안만, 간편하게</div>
 </header>
 <div class="preview-tools"><label for="scenario"><span>상태 미리보기</span><select id="scenario"></select></label><span class="hint">상태를 바꾸거나 화면의 버튼을 눌러 흐름을 확인하세요.</span></div>
 <main id="main"></main>
 <footer><span class="footer-brand">TEMPORARY DROP</span><span>예시 파일·가상 상태로 구성한 UI 설계안입니다. 파일 내용은 읽거나 전송하지 않습니다.</span></footer>
</div>
<dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
<div id="toast" class="toast hidden" role="status"></div>
<input id="file-input" type="file" multiple hidden>
<script>
'use strict';
const main=document.getElementById('main'), scenario=document.getElementById('scenario'), dialog=document.getElementById('dialog');
const presets={upload:[['trusted','신뢰 기기 · 전송 중'],['public','공용 PC · 남은 시간'],['expired','세션 만료 · 기존 전송 유지'],['auth','TOTP 인증'],['offline','인터넷 연결 끊김'],['complete','업로드 완료']],download:[['locked','PIN 잠금 화면'],['files','다운로드 목록'],['empty','빈 목록']],devices:[['list','등록한 기기 목록'],['auth','기기 관리 인증']]};
let page='upload',mode='trusted',toastTimer,simulationTimer,dialogTrigger;
let files=[],devices=[];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function formatSize(n){if(n>=1073741824)return(n/1073741824).toFixed(1)+' GiB';if(n>=1048576)return(n/1048576).toFixed(1)+' MiB';return n+' bytes'}
function resetFiles(){files=[{id:1,name:'experiment-video.zip',size:17179869184,ext:'ZIP',state:'uploading',progress:74,retention:'24시간'},{id:2,name:'회의 자료.pdf',size:14994636,ext:'PDF',state:'ready',progress:100,retention:'24시간'},{id:3,name:'현장 사진.zip',size:871366656,ext:'ZIP',state:'queued',progress:0,retention:'24시간'}];if(mode==='complete')files.forEach(f=>{f.state='ready';f.progress=100});if(mode==='offline')files[0].state='offline'}
function resetDevices(){devices=[{id:'windows',name:'집 Windows',icon:'▱',current:true,scope:'브라우저 업로드',last:'지금 사용 중'},{id:'iphone',name:'내 iPhone 단축어',icon:'▯',scope:'단축어 업로드 전용',last:'2시간 전 사용'},{id:'ipad',name:'iPad',icon:'▯',scope:'브라우저 업로드',last:'어제 사용'}]}
function navigate(next,customMode){clearInterval(simulationTimer);page=next;mode=customMode||presets[page][0][0];scenario.innerHTML=presets[page].map(([v,t])=>'<option value="'+v+'">'+t+'</option>').join('');scenario.value=mode;document.querySelectorAll('[data-page]').forEach(b=>{if(b.dataset.page===page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});if(page==='upload')resetFiles();render()}
function showToast(message){const t=document.getElementById('toast');t.textContent=message;t.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.add('hidden'),4200)}
function showDialog(content){dialogTrigger=document.activeElement;document.getElementById('dialog-content').innerHTML=content;dialog.showModal()}
function closeDialog(){dialog.close();document.getElementById('dialog-content').replaceChildren();if(dialogTrigger?.isConnected)dialogTrigger.focus()}
dialog.addEventListener('cancel',e=>{e.preventDefault();closeDialog()});
function pageHead(kicker,title,description,right=''){return '<div class="page-head"><div><div class="eyebrow">'+kicker+'</div><h1>'+title+'</h1><p>'+description+'</p></div>'+right+'</div>'}
function authView(kind){const pin=kind==='pin',manage=kind==='manage';return '<section class="auth-wrap"><div class="panel"><div class="auth-symbol" aria-hidden="true">'+(pin?'⌑':'✳')+'</div><h1>'+(pin?'파일을 받아보세요':manage?'내 기기를 관리하세요':'파일을 올리려면 인증해 주세요')+'</h1><p class="auth-intro">'+(pin?'다운로드 PIN을 입력하면 목록을 볼 수 있어요.':'Google Authenticator의 6자리 코드를 입력하세요.')+'</p><form id="auth-form" data-kind="'+kind+'"><label class="field"><span>'+(pin?'다운로드 PIN':'인증 코드')+'</span><input class="code" id="auth-code" type="'+(pin?'password':'text')+'" inputmode="numeric" autocomplete="'+(pin?'off':'one-time-code')+'" maxlength="'+(pin?4:6)+'" placeholder="'+(pin?'••••':'000000')+'" required aria-describedby="auth-help auth-error"></label>'+(pin?'<label class="checkbox"><input type="checkbox">내 기기에서만 30일 동안 기억</label>':manage?'':'<label class="checkbox"><input type="checkbox" id="trust">내 개인 기기입니다.<br>다음부터 인증 없이 업로드합니다.</label><label class="field hidden" id="device-name-field"><span>기기 이름</span><input id="device-name" placeholder="예: 집 Windows" maxlength="50"></label>')+'<p class="help" id="auth-help">'+(pin?'공용 PC에서는 기억하기를 선택하지 마세요.':manage?'관리 인증은 이 브라우저를 신뢰 기기로 등록하지 않습니다.':'기본 설정에서는 15분 동안 새 업로드를 시작할 수 있어요.')+'</p><p id="auth-error" class="error" role="alert"></p><button class="btn primary full" type="submit">'+(pin?'파일 목록 열기':manage?'인증하고 관리하기':'인증하고 계속')+' <span aria-hidden="true">→</span></button></form></div><p class="auth-foot">시안에서는 임의의 '+(pin?'4':'6')+'자리 숫자로 화면 흐름을 확인할 수 있습니다.</p></section>'}
function uploadView(){if(mode==='auth')return authView('totp');const expired=mode==='expired',isPublic=mode==='public'||expired,active=files.filter(f=>['uploading','offline'].includes(f.state)).length;let badge=isPublic?'<span class="badge warn"><span aria-hidden="true">◷</span> 공용 PC · '+(expired?'새 업로드 시간 만료':'<span class="mono">12:34</span> 남음')+'</span>':'<span class="badge"><span class="dot"></span>신뢰하는 기기 · 집 Windows</span>';let html=pageHead('SEND / UPLOAD','파일 올리기','다른 기기에서 받을 파일을 잠시 보관하세요.',badge);
if(expired)html+='<div class="banner"><span aria-hidden="true">◷</span><div class="body"><strong>새 업로드 가능 시간이 끝났습니다.</strong><p>진행 중인 '+active+'개 파일은 계속 전송됩니다. 새 파일은 다시 인증한 후 시작할 수 있어요.</p></div><button class="btn small" data-action="reauth">다시 인증</button></div>';
if(mode==='public')html+='<div class="banner info"><span aria-hidden="true">ⓘ</span><div class="body"><strong>이 PC에서는 15분 동안 새 업로드를 시작할 수 있어요.</strong><p>시간이 끝나도 진행 중인 파일은 계속 전송됩니다.</p></div><button class="btn small ghost" data-action="expire">만료 상태 보기</button></div>';
if(mode==='offline')html+='<div class="banner"><span aria-hidden="true">⌁</span><div class="body"><strong>인터넷 연결을 기다리고 있어요.</strong><p>연결이 돌아오면 보내지 못한 부분부터 다시 전송합니다.</p></div><button class="btn small" data-action="reconnect">연결 복구 시연</button></div>';
html+='<div class="grid"><section><div class="dropzone '+(expired?'disabled':'')+'" id="dropzone"><div class="upload-icon" aria-hidden="true">↑</div><h2>'+(expired?'새 파일을 올리려면 다시 인증해 주세요':'파일을 여기에 놓아주세요')+'</h2><p>파일당 최대 32 GiB · 업로드 완료 후 선택한 기간 동안 보관</p><div class="button-row"><button class="btn primary" data-action="choose" '+(expired?'disabled':'')+'>＋ 파일 선택</button><button class="btn" data-action="sample" '+(expired?'disabled':'')+'>예시 파일 추가</button></div><div class="retention"><label for="retention">기본 보관 기간</label><select id="retention" '+(expired?'disabled':'')+'><option>1시간</option><option>6시간</option><option selected>24시간</option><option>3일</option></select></div></div><div class="section-head"><h2>전송 목록</h2><span>대기 '+files.filter(f=>f.state==='queued').length+' · 전송 '+active+' · 완료 '+files.filter(f=>f.state==='ready').length+'</span></div><div class="panel queue">'+(files.length?files.map(uploadRow).join(''):'<div class="empty"><h2>아직 선택한 파일이 없어요.</h2><p>파일을 추가해 전송을 시작하세요.</p></div>')+'</div>'+(files.some(f=>f.state==='queued')?'<div class="row-footer"><span class="help">보관 기간은 파일마다 바꿀 수 있어요.</span><button class="btn primary" data-action="start" '+(expired?'disabled':'')+'>대기 파일 업로드 시작</button></div>':'')+'<p class="preview-caption">진행률·속도·남은 시간은 디자인 검토용 예시입니다.</p></section><aside class="sidebar"><div class="panel sidebar-card"><div class="section-kicker">A LITTLE ROOM BETWEEN DEVICES</div><h3>잠깐 두고,<br>다른 기기에서 받으세요.</h3><p>파일 받기 페이지에서 PIN을 입력하면 완료된 파일을 볼 수 있어요.</p><hr><div class="stat-row"><span class="muted">기본 보관</span><strong>완료 후 24시간</strong></div><div class="stat-row"><span class="muted">웹 파일 크기</span><strong>최대 32 GiB</strong></div><div class="stat-row"><span class="muted">시간이 지나면</span><strong>자동 만료</strong></div><hr><button class="btn full" data-action="goto-download">파일 받기로 이동 <span aria-hidden="true">↗</span></button></div><div class="aside-note"><strong>전송 중에는 이 탭을 유지해 주세요.</strong>브라우저를 닫으면 전송이 멈출 수 있습니다. 연결이 잠깐 끊기는 경우에는 다시 시도할 수 있어요.</div>'+(isPublic?'<button class="btn ghost full" data-action="end-session">이 PC에서 종료</button>':'')+'</aside></div>';return html}
function uploadRow(f){const st=f.state;const labels={uploading:'전송 중',offline:'연결 대기',queued:mode==='expired'?'인증 필요':'대기 중',ready:'✓ 업로드 완료',cancelled:'취소됨'};return '<article class="upload-row"><div class="file-top"><span class="file-icon '+f.ext.toLowerCase()+'" aria-hidden="true">'+esc(f.ext)+'</span><div class="file-info"><div class="filename">'+esc(f.name)+'</div><div class="filemeta">'+formatSize(f.size)+' · '+(st==='ready'?'완료 후 '+f.retention+' 보관':f.retention+' 보관')+'</div></div><span class="status '+(st==='offline'||(st==='queued'&&mode==='expired')?'warn':'')+'">'+labels[st]+'</span></div>'+(['uploading','offline'].includes(st)?'<div class="progress '+(st==='offline'?'warn':'')+'" role="progressbar" aria-label="'+esc(f.name)+' 전송률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+f.progress+'"><div style="width:'+f.progress+'%"></div></div><div class="progress-meta"><span>'+formatSize(f.size*f.progress/100)+' / '+formatSize(f.size)+'　'+(st==='offline'?'속도 —':'48 MiB/s')+'</span><strong>'+f.progress+'%</strong></div><div class="row-footer"><span class="help">'+(st==='offline'?'연결을 기다리는 중':'약 1분 30초 남음')+'</span><button class="btn ghost" data-action="cancel" data-id="'+f.id+'">취소</button></div>':st==='queued'?'<div class="row-footer"><label class="help">보관 기간 <select class="inline-select" data-retention-id="'+f.id+'">'+['1시간','6시간','24시간','3일'].map(t=>'<option '+(f.retention===t?'selected':'')+'>'+t+'</option>').join('')+'</select></label><button class="btn ghost" data-action="remove" data-id="'+f.id+'">목록에서 제거</button></div>':st==='ready'?'<div class="row-footer"><span class="help">다른 기기에서 받을 수 있어요.</span><button class="btn ghost" data-action="remove" data-id="'+f.id+'">이 화면에서 지우기</button></div>':'')+'</article>'}
const downloadFiles=[{name:'회의 자료.pdf',ext:'PDF',size:'14.3 MiB',ago:'5분 전 완료',expires:'23시간 남음',date:'10월 3일 16:55까지'},{name:'현장 사진.zip',ext:'ZIP',size:'831 MiB',ago:'31분 전 완료',expires:'29분 남음',date:'오늘 17:29까지',soon:true},{name:'experiment-video.zip',ext:'ZIP',size:'16.0 GiB',ago:'2시간 전 완료',expires:'22시간 남음',date:'10월 3일 15:00까지'}];
function downloadView(){if(mode==='locked')return authView('pin');return pageHead('RECEIVE / DOWNLOAD','받을 수 있는 파일','보관 시간이 끝나면 자동으로 사라집니다.','<span class="badge"><span class="dot"></span>다운로드 잠금 해제됨</span>')+'<div class="download-toolbar"><span class="muted">'+(mode==='empty'?'0':'3')+'개 파일 · 최근 완료한 순서</span><div><button class="btn small ghost" data-action="refresh">↻ 새로고침</button><button class="btn small" data-action="lock">잠금</button></div></div><section class="panel file-table">'+(mode==='empty'?'<div class="empty"><div class="empty-icon" aria-hidden="true">↓</div><h2>아직 받을 파일이 없어요.</h2><p>다른 기기에서 파일을 올리면 여기에 표시됩니다.</p><button class="btn" style="margin-top:22px" data-action="goto-upload">파일 올리기</button></div>':'<div class="table-head" aria-hidden="true"><span>파일 이름</span><span>크기</span><span>보관 시간</span><span></span></div>'+downloadFiles.map(f=>'<article class="download-row"><div class="download-name"><span class="file-icon '+f.ext.toLowerCase()+'" aria-hidden="true">'+f.ext+'</span><div class="file-info"><div class="filename">'+f.name+'</div><div class="filemeta">'+f.ago+'</div></div></div><div class="download-size">'+f.size+'</div><div class="expiry '+(f.soon?'soon':'')+'">'+f.expires+'<span>'+f.date+'</span></div><button class="btn small" data-action="download">↓ 다운로드</button></article>').join(''))+'</section><div class="list-foot"><span>파일은 업로드 완료 후에 표시됩니다.</span><span>예시 시간대 · 서울</span></div><div class="banner info" style="margin-top:28px"><span aria-hidden="true">ⓘ</span><div class="body"><strong>공용 PC에서 사용하고 있나요?</strong><p>작업을 마친 뒤 잠금을 눌러 이 브라우저의 다운로드 접근을 종료하세요.</p></div></div>'}
function devicesView(){if(mode==='auth')return authView('manage');return pageHead('ACCESS / YOUR DEVICES','내 기기','등록한 기기는 인증 없이 파일을 올릴 수 있어요.','<button class="btn primary" data-action="shortcut">＋ iPhone 단축어 연결</button>')+'<div class="download-toolbar"><span class="muted">'+devices.length+'개 등록 기기</span><span class="help">기기별로 권한을 해제할 수 있습니다.</span></div><section class="panel">'+devices.map(d=>'<article class="device-row"><span class="device-icon" aria-hidden="true">'+d.icon+'</span><div class="device-info"><div class="device-title">'+esc(d.name)+(d.current?'<span class="tiny-badge">현재 기기</span>':'')+'</div><div class="device-note">'+d.scope+' · '+d.last+'</div></div><button class="btn small ghost text-danger" data-action="revoke" data-id="'+d.id+'">권한 해제</button></article>').join('')+'</section><div class="grid" style="margin-top:24px"><div class="panel sidebar-card"><div class="note-icon" aria-hidden="true">✳</div><h3>기기를 잃어버렸다면 권한을 해제하세요.</h3><p>선택한 기기의 새 업로드와 진행 중인 전송이 차단됩니다. 해제하려면 Google Authenticator 코드가 필요합니다.</p><p style="margin-bottom:0">브라우저 데이터를 지운 경우, 같은 기기에서도 다시 등록해야 할 수 있어요.</p></div><div class="aside-note"><strong>iPhone에서는 공유 메뉴로</strong>사진이나 파일을 선택한 다음, 개인 단축어를 실행해 업로드합니다. 단축어의 기기 토큰은 다른 사람에게 공유하지 마세요.</div></div>'}
function render(){main.innerHTML=page==='upload'?uploadView():page==='download'?downloadView():devicesView();bindDrop()}
function bindDrop(){const z=document.getElementById('dropzone');if(!z)return;z.addEventListener('dragover',e=>{e.preventDefault();if(mode!=='expired')z.classList.add('drag')});z.addEventListener('dragleave',()=>z.classList.remove('drag'));z.addEventListener('drop',e=>{e.preventDefault();z.classList.remove('drag');if(mode!=='expired')addFiles([...e.dataTransfer.files])})}
function addFiles(selected){if(!selected.length)return;const retention=document.getElementById('retention')?.value||'24시간';let skipped=0;selected.slice(0,50).forEach(f=>{if(f.size<=0||f.size>34359738368){skipped++;return}files.push({id:Date.now()+Math.random(),name:f.name,size:f.size,ext:(f.name.split('.').pop()||'FILE').slice(0,4).toUpperCase(),state:'queued',progress:0,retention})});render();showToast(skipped?'크기가 지원 범위를 벗어난 '+skipped+'개 파일은 제외했습니다.':'파일 이름과 크기만 시안에 추가했습니다. 내용은 읽지 않습니다.')}
function askReauth(){showDialog('<h2 id="dialog-title">새 업로드를 시작하려면 인증해 주세요</h2><p>진행 중인 파일은 그대로 전송됩니다.</p><form id="reauth-form"><label class="field"><span>Authenticator 코드</span><input class="code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" required pattern="[0-9]{6}"></label><p class="help">시안에서는 임의의 6자리 숫자를 입력하세요.</p><div class="dialog-actions"><button type="button" class="btn" data-action="close">나중에</button><button class="btn primary">인증하고 계속</button></div></form>')}
function confirmRevoke(id){const d=devices.find(x=>x.id===id);if(!d)return;showDialog('<h2 id="dialog-title">'+esc(d.name)+'의 권한을 해제할까요?</h2><p>새 파일 업로드와 이 기기의 진행 중인 전송이 차단됩니다.'+(d.current?' 현재 브라우저도 다시 인증해야 합니다.':'')+'</p><form id="revoke-form" data-id="'+id+'"><label class="field"><span>Authenticator 코드</span><input class="code" name="code" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" required placeholder="000000"></label><p class="help">시안에서는 임의의 6자리 숫자로 확인할 수 있습니다.</p><div class="dialog-actions"><button class="btn" type="button" data-action="close">돌아가기</button><button class="btn danger">권한 해제</button></div></form>')}
function shortcutDialog(){showDialog('<h2 id="dialog-title">iPhone 단축어 연결</h2><p>이 토큰은 단축어에서 파일을 올리는 용도로만 사용됩니다.</p><form id="shortcut-form"><label class="field"><span>기기 이름</span><input name="name" required maxlength="50" value="내 iPhone 단축어"></label><label class="field"><span>Authenticator 코드</span><input class="code" name="code" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" required placeholder="000000"></label><p class="help">시안에서는 실제 토큰을 발급하지 않습니다.</p><div class="dialog-actions"><button type="button" class="btn" data-action="close">취소</button><button class="btn primary">토큰 발급 화면 보기</button></div></form>')}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-page]');if(nav){navigate(nav.dataset.page);return}const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,id=b.dataset.id;switch(a){case'choose':document.getElementById('file-input').click();break;case'sample':addFiles([{name:'새로운 자료-'+(files.length+1)+'.pdf',size:25165824}]);break;case'goto-download':navigate('download','files');break;case'goto-upload':navigate('upload');break;case'expire':mode='expired';scenario.value=mode;render();break;case'reauth':askReauth();break;case'reconnect':mode='public';scenario.value=mode;files.forEach(f=>{if(f.state==='offline')f.state='uploading'});render();showToast('연결이 돌아오면 실패한 부분부터 다시 전송합니다.');break;case'remove':files=files.filter(f=>String(f.id)!==id);render();break;case'cancel':showDialog('<h2 id="dialog-title">이 파일의 업로드를 취소할까요?</h2><p>전송한 데이터는 정리됩니다. 다시 올리려면 처음부터 시작해야 합니다.</p><div class="dialog-actions"><button class="btn" data-action="close">계속 업로드</button><button class="btn danger" data-action="confirm-cancel" data-id="'+id+'">업로드 취소</button></div>');break;case'confirm-cancel':files.forEach(f=>{if(String(f.id)===id)f.state='cancelled'});closeDialog();render();showToast('시안의 업로드가 취소되었습니다.');break;case'start':files.forEach(f=>{if(f.state==='queued'){f.state='uploading';f.progress=8}});render();showToast('가상 진행률을 보여줍니다. 실제 파일 전송은 없습니다.');clearInterval(simulationTimer);simulationTimer=setInterval(()=>{if(page!=='upload'){clearInterval(simulationTimer);return}files.forEach(f=>{if(f.state==='uploading'){f.progress=Math.min(100,f.progress+9);if(f.progress===100)f.state='ready'}});render();if(!files.some(f=>f.state==='uploading'))clearInterval(simulationTimer)},1200);break;case'lock':navigate('download','locked');showToast('다운로드 잠금을 설정했습니다.');break;case'refresh':showToast('예시 파일 목록을 새로고침했습니다.');break;case'download':showToast('실제 서비스에서는 파일 다운로드가 시작됩니다. 이 화면은 시안입니다.');break;case'revoke':confirmRevoke(id);break;case'shortcut':shortcutDialog();break;case'close':closeDialog();break;case'end-session':showDialog('<h2 id="dialog-title">이 PC에서 작업을 마칠까요?</h2><p>진행 중인 업로드가 취소되고 이 PC의 업로드·다운로드 접근이 종료됩니다.</p><div class="dialog-actions"><button class="btn" data-action="close">계속 사용</button><button class="btn danger" data-action="confirm-end">취소하고 종료</button></div>');break;case'confirm-end':closeDialog();navigate('upload','auth');showToast('이 PC에서의 작업을 종료했습니다.');break;case'copy-token':if(navigator.clipboard){navigator.clipboard.writeText('DEMO_ONLY_NOT_A_REAL_DEVICE_TOKEN').then(()=>showToast('사용할 수 없는 예시 토큰을 복사했습니다.')).catch(()=>showToast('예시 토큰을 직접 선택해 복사해 주세요.'))}else showToast('예시 토큰을 직접 선택해 복사해 주세요.');break}});
document.addEventListener('change',e=>{if(e.target.id==='trust'){const checked=e.target.checked;document.getElementById('device-name-field').classList.toggle('hidden',!checked);document.getElementById('device-name').required=checked;document.getElementById('auth-help').textContent=checked?'공용 PC에서는 이 옵션을 선택하지 마세요.':'기본 설정에서는 15분 동안 새 업로드를 시작할 수 있어요.'}if(e.target.dataset.retentionId){const f=files.find(x=>String(x.id)===e.target.dataset.retentionId);if(f)f.retention=e.target.value}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;if(f.id==='auth-form'){const kind=f.dataset.kind,code=document.getElementById('auth-code').value.replace(/\s/g,'');if(!(kind==='pin'?/^\d{4}$/:/^\d{6}$/).test(code)){document.getElementById('auth-error').textContent='숫자 '+(kind==='pin'?4:6)+'자리를 입력해 주세요.';return}if(kind==='pin')navigate('download','files');else if(kind==='manage')navigate('devices','list');else navigate('upload',document.getElementById('trust')?.checked?'trusted':'public');showToast('시안의 인증 흐름을 완료했습니다. 실제 인증은 수행하지 않았습니다.')}if(f.id==='reauth-form'){mode='public';scenario.value=mode;closeDialog();render();showToast('진행 중인 전송을 유지하고 새 업로드 시간을 갱신했습니다.')}if(f.id==='revoke-form'){const wasCurrent=devices.find(d=>d.id===f.dataset.id)?.current;devices=devices.filter(d=>d.id!==f.dataset.id);closeDialog();if(wasCurrent)navigate('devices','auth');else render();showToast('예시 기기의 권한을 해제했습니다.')}if(f.id==='shortcut-form'){const name=new FormData(f).get('name');devices.push({id:'demo-'+Date.now(),name,icon:'▯',scope:'단축어 업로드 전용',last:'방금 등록'});document.getElementById('dialog-content').innerHTML='<h2 id="dialog-title">개인 단축어에 토큰을 입력하세요</h2><p>실제 서비스에서는 이 화면에서만 토큰을 볼 수 있습니다. 아래는 사용할 수 없는 예시입니다.</p><div class="token" tabindex="0">DEMO_ONLY_NOT_A_REAL_DEVICE_TOKEN</div><p class="help" style="margin-top:15px">단축어 템플릿을 복제하고 개인 토큰을 입력하세요. 다른 사람에게 단축어를 공유하기 전에 토큰을 제거하세요.</p><div class="dialog-actions"><button class="btn" data-action="copy-token">예시 복사</button><button class="btn primary" data-action="close">확인</button></div>';render();dialog.querySelector('button').focus()}});
document.getElementById('file-input').addEventListener('change',e=>{addFiles([...e.target.files]);e.target.value=''});
scenario.addEventListener('change',()=>{clearInterval(simulationTimer);mode=scenario.value;if(page==='upload')resetFiles();render()});
document.querySelector('.brand').addEventListener('click',e=>{e.preventDefault();navigate('upload')});
resetDevices();navigate('upload');
</script>
